<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Portfolio CMS</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-page">
    <!-- Header -->
    <header class="admin-header">
        <div class="admin-header-content">
            <div class="header-left">
                <i class="fas fa-cog"></i>
                <h1>Admin Dashboard</h1>
            </div>
            <div class="header-right">
                <span class="admin-user">
                    <i class="fas fa-user-circle"></i>
                    <span id="adminUsername"></span>
                </span>
                <button id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="admin-nav">
        <button class="nav-tab active" data-tab="projects">
            <i class="fas fa-folder"></i> Projekte
        </button>
        <button class="nav-tab" data-tab="skills">
            <i class="fas fa-code"></i> Skills
        </button>
        <button class="nav-tab" data-tab="about">
            <i class="fas fa-user"></i> Über mich
        </button>
        <button class="nav-tab" data-tab="stats">
            <i class="fas fa-chart-bar"></i> Statistiken
        </button>
        <button class="nav-tab" data-tab="contact">
            <i class="fas fa-address-book"></i> Kontakt
        </button>
        <a href="index.html" class="back-to-site-btn">
            <i class="fas fa-arrow-left"></i> Zurück zur Website
        </a>
    </nav>

    <!-- Main Content -->
    <main class="admin-main">
        <!-- Projects Tab -->
        <section id="projectsTab" class="tab-content active">
            <div class="content-header">
                <h2><i class="fas fa-folder"></i> Projekte verwalten</h2>
                <button id="addProjectBtn" class="primary-btn">
                    <i class="fas fa-plus"></i> Neues Projekt
                </button>
            </div>
            
            <div id="projectsList" class="items-list"></div>
        </section>

        <!-- Skills Tab -->
        <section id="skillsTab" class="tab-content">
            <div class="content-header">
                <h2><i class="fas fa-code"></i> Skills verwalten</h2>
                <button id="saveSkillsBtn" class="primary-btn">
                    <i class="fas fa-save"></i> Speichern
                </button>
            </div>
            
            <div class="skills-editor">
                <div class="skill-category">
                    <h3>🎨 Frontend</h3>
                    <div id="frontendSkillsEditor"></div>
                    <button class="secondary-btn add-skill-btn" data-category="frontend">
                        <i class="fas fa-plus"></i> Skill hinzufügen
                    </button>
                </div>
                
                <div class="skill-category">
                    <h3>⚙️ Backend</h3>
                    <div id="backendSkillsEditor"></div>
                    <button class="secondary-btn add-skill-btn" data-category="backend">
                        <i class="fas fa-plus"></i> Skill hinzufügen
                    </button>
                </div>
                
                <div class="skill-category">
                    <h3>🛠️ Tools</h3>
                    <div id="toolsSkillsEditor"></div>
                    <button class="secondary-btn add-skill-btn" data-category="tools">
                        <i class="fas fa-plus"></i> Skill hinzufügen
                    </button>
                </div>
            </div>
        </section>

        <!-- About Tab -->
        <section id="aboutTab" class="tab-content">
            <div class="content-header">
                <h2><i class="fas fa-user"></i> Über mich bearbeiten</h2>
                <button id="saveAboutBtn" class="primary-btn">
                    <i class="fas fa-save"></i> Speichern
                </button>
            </div>
            
            <div class="about-editor">
                <div class="lang-section">
                    <h3>🇩🇪 Deutsch</h3>
                    <div class="form-group">
                        <label>Text</label>
                        <textarea id="aboutTextDe" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Highlight Text</label>
                        <textarea id="aboutHighlightDe" rows="2"></textarea>
                    </div>
                </div>
                
                <div class="lang-section">
                    <h3>🇬🇧 English</h3>
                    <div class="form-group">
                        <label>Text</label>
                        <textarea id="aboutTextEn" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Highlight Text</label>
                        <textarea id="aboutHighlightEn" rows="2"></textarea>
                    </div>
                </div>
            </div>
        </section>

        <!-- Stats Tab -->
        <section id="statsTab" class="tab-content">
            <div class="content-header">
                <h2><i class="fas fa-chart-bar"></i> Statistiken bearbeiten</h2>
                <button id="saveStatsBtn" class="primary-btn">
                    <i class="fas fa-save"></i> Speichern
                </button>
            </div>
            
            <div class="stats-editor">
                <div class="form-group">
                    <label>Projekte</label>
                    <input type="number" id="statsProjects" min="0">
                </div>
                <div class="form-group">
                    <label>Technologien</label>
                    <input type="number" id="statsTechnologies" min="0">
                </div>
                <div class="form-group">
                    <label>Commits</label>
                    <input type="number" id="statsCommits" min="0">
                </div>
            </div>
        </section>

        <!-- Contact Tab -->
        <section id="contactTab" class="tab-content">
            <div class="content-header">
                <h2><i class="fas fa-address-book"></i> Kontakt bearbeiten</h2>
                <button id="saveContactBtn" class="primary-btn">
                    <i class="fas fa-save"></i> Speichern
                </button>
            </div>
            
            <div class="about-editor">
                <div class="lang-section">
                    <h3>📧 Email & Telefon</h3>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="contactEmail" placeholder="email@beispiel.de">
                    </div>
                    <div class="form-group">
                        <label>Telefon</label>
                        <input type="tel" id="contactPhone" placeholder="+41 78 123 45 67">
                    </div>
                </div>
                
                <div class="lang-section">
                    <h3>📍 Adresse</h3>
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="contactName" placeholder="Max Mustermann">
                    </div>
                    <div class="form-group">
                        <label>Strasse</label>
                        <input type="text" id="contactStreet" placeholder="Musterstrasse 123">
                    </div>
                    <div class="form-group">
                        <label>Stadt</label>
                        <input type="text" id="contactCity" placeholder="1234 Stadt, Land">
                    </div>
                </div>
                
                <div class="lang-section">
                    <h3>🔗 Social Media</h3>
                    <div class="form-group">
                        <label>GitHub URL</label>
                        <input type="url" id="contactGithub" placeholder="https://github.com/username">
                    </div>
                    <div class="form-group">
                        <label>LinkedIn URL</label>
                        <input type="url" id="contactLinkedin" placeholder="https://linkedin.com/in/username">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Project Modal -->
    <div id="projectModal" class="admin-modal" style="display: none;">
        <div class="admin-modal-content">
            <div class="modal-header">
                <h3 id="projectModalTitle">Neues Projekt</h3>
                <button class="close-modal-btn" onclick="closeProjectModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="projectForm" class="modal-body">
                <input type="hidden" id="projectId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Titel (DE) *</label>
                        <input type="text" id="projectTitleDe" required>
                    </div>
                    <div class="form-group">
                        <label>Titel (EN) *</label>
                        <input type="text" id="projectTitleEn" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Kurzbeschreibung (DE)</label>
                        <input type="text" id="projectShortDescDe">
                    </div>
                    <div class="form-group">
                        <label>Kurzbeschreibung (EN)</label>
                        <input type="text" id="projectShortDescEn">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group full-width">
                        <label>Beschreibung (DE)</label>
                        <textarea id="projectFullDescDe" rows="4"></textarea>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group full-width">
                        <label>Beschreibung (EN)</label>
                        <textarea id="projectFullDescEn" rows="4"></textarea>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Dauer (DE)</label>
                        <input type="text" id="projectDurationDe" placeholder="z.B. 2 Wochen">
                    </div>
                    <div class="form-group">
                        <label>Dauer (EN)</label>
                        <input type="text" id="projectDurationEn" placeholder="e.g. 2 weeks">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Technologien (kommagetrennt)</label>
                    <input type="text" id="projectTechnologies" placeholder="HTML, CSS, JavaScript">
                </div>
                
                <div class="form-group">
                    <label>Features (DE, kommagetrennt)</label>
                    <input type="text" id="projectFeaturesDe" placeholder="🎨 Feature 1, ✨ Feature 2">
                </div>
                
                <div class="form-group">
                    <label>Features (EN, kommagetrennt)</label>
                    <input type="text" id="projectFeaturesEn" placeholder="🎨 Feature 1, ✨ Feature 2">
                </div>
                
                <div class="form-group">
                    <label>YouTube Video URL (optional)</label>
                    <input type="text" id="projectVideoUrl" placeholder="https://www.youtube.com/embed/...">
                    <small>YouTube Embed URL verwenden</small>
                </div>
                
                <div class="form-group">
                    <label>Bild Upload (optional)</label>
                    <input type="file" id="projectImageUpload" accept="image/*">
                    <div id="projectImagePreview" class="image-preview"></div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>GitHub URL (optional)</label>
                        <input type="text" id="projectGithubUrl" placeholder="https://github.com/...">
                    </div>
                    <div class="form-group">
                        <label>Live Demo URL (optional)</label>
                        <input type="text" id="projectLiveUrl" placeholder="https://...">
                    </div>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="secondary-btn" onclick="closeProjectModal()">
                        Abbrechen
                    </button>
                    <button type="submit" class="primary-btn">
                        <i class="fas fa-save"></i> Speichern
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="admin-dashboard.js"></script>
</body>
</html>
